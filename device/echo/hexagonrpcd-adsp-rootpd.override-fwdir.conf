# El dominio raíz del ADSP carga sus módulos dinámicos de AVS por fastrpc desde lo que le sirve
# este demonio. hexagonrpcd los expone en /usr/lib/qcom/adsp tomando <-R>/dsp/adsp; sin -R el
# prefijo es /usr/share/qcom/ y ese directorio no existe, así que el ADSP ve una carpeta vacía.
#
# Entre esos módulos están las canceladoras de eco modernas: smecns_v2_module.so.1,
# mmecns_module.so.1 y fluence_*_module.so.1 (map_AVS_SHARED_LIBS_7150 de la partición dsp;
# idénticos a los que instala firmware-xiaomi-surya en .../surya/dsp/adsp). Sin ellos, el DSP
# falla el TOPOLOGY_COMMIT de cualquier topología SMECNS V2 (0x10F89 de serie y 0x10000003 del
# fabricante), mientras que la ECNS antigua 0x10F71, que va dentro de adsp.mbn, confirma bien
# (2026-09-12). Mismo -R que el demonio de sensores.
#
# stdbuf -oL: hexagonrpcd escribe algunos avisos por la salida estándar con printf (p. ej. el de
# apps_std_fopen_with_env_fd, que es un esbozo sin implementar). Bajo systemd esa salida va con
# búfer de bloque y no llega al diario; por línea sí. El dominio raíz apenas escribe nada más.
[Service]
ExecStart=
ExecStart=/usr/bin/stdbuf -oL /usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -R /usr/share/qcom/sm7150/Xiaomi/surya
