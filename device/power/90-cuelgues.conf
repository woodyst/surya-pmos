# Detectar cuelgues y reiniciar dejando rastro, en vez de quedarse frito.
#
# ⚠️ Los tres cubren clases DISTINTAS, y hacen falta los tres:
#
#   hung_task_panic     tareas BLOQUEADAS (estado D) mas de N segundos.
#                       Es el que capturo los cuatro panicos del 2026-08-22, con
#                       la pila entera: la suspension de IPA esperando sin plazo.
#
#   softlockup_panic    una CPU GIRANDO sin ceder el paso. hung_task NO lo ve:
#                       la tarea no esta bloqueada, esta corriendo. El 2026-08-23
#                       el movil se quedo congelado SIN reiniciar y sin dejar
#                       nada -- ni panico, ni ramoops, ni diario -- porque el
#                       kernel seguia vivo lo justo para acariciar al perro
#                       guardian por hardware, y ningun detector miraba este caso.
#
#   panic_on_rcu_stall  un lector de RCU que no termina nunca. Otra forma de
#                       "vivo pero atascado" que los dos anteriores no cubren.
#
# ⚠️ El perro guardian por HARDWARE (qcom_wdt, 5 s via systemd) NO basta: lo
#    acaricia PID 1, y si PID 1 sigue vivo no dispara aunque el movil sea
#    inservible. Comprobado el 2026-08-23: congelado varios minutos, watchdog
#    armado, y no reinicio.
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 120

# Una CPU girando 2x watchdog_thresh (20 s con el valor por defecto de 10).
kernel.softlockup_panic = 1

# RCU atascado.
kernel.panic_on_rcu_stall = 1

# Reiniciar 5 s despues del panico, para que de tiempo a escribir el rastro.
kernel.panic = 5
kernel.panic_on_oops = 1

# ★ QUE EL PANICO CUENTE ALGO. Sin esto, el volcado del 2026-08-23 solo decia
#   "watchdog pretimeout event" y la pila de la CPU ociosa: nada sobre QUE estaba
#   haciendo el resto del sistema, que es justo lo que hacia falta.
#
# ⚠️ `panic_print` (la mascara de bits) esta OBSOLETO en 7.1: el kernel lo
#    traduce y avisa por consola. El mando bueno es `panic_sys_info`, una lista
#    de nombres. Se pide todo lo util:
#      tasks          estado de TODAS las tareas
#      blocked_tasks  las bloqueadas, aparte
#      all_bt         pila de TODAS las CPU  <- clave: el cuelgue del 23 no tenia
#                     ninguna tarea en D, asi que hay que mirar que hace cada CPU
#      mem, timers, locks
#
# ⚠️ NO se pide `ftrace`: con 4 MB/CPU x 8 el volcado puede no terminar, y ya nos
#    dejo un congelado sin reiniciar.
kernel.panic_sys_info = tasks,mem,timers,locks,all_bt,blocked_tasks

# Permitir sysrq entero. Con un teclado USB conectado, en un cuelgue se puede
# pedir a mano lo que el sistema ya no cuenta -- y sale por la consola (VT1), que
# es lo unico que responde:
#   Alt+ImprPant+W   tareas BLOQUEADAS
#   Alt+ImprPant+T   TODAS las tareas
#   Alt+ImprPant+L   pila de todas las CPU
#   Alt+ImprPant+S   sincronizar disco     Alt+ImprPant+B  reiniciar en caliente
# ⚠️ Reiniciar asi CONSERVA ramoops; el apagado largo con el boton lo BORRA.
kernel.sysrq = 1
