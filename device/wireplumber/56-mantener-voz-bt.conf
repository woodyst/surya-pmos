# Registrar el enganche que mantiene el auricular Bluetooth en camino de voz
# durante la llamada.
#
# ⚠️ RUTAS, que no son la misma:
#   este .conf  -> ~/.config/wireplumber/wireplumber.conf.d/
#   el guion    -> ~/.local/share/wireplumber/scripts/device/
# WirePlumber busca los guiones en el directorio de DATOS del usuario, no en el
# de configuracion.  Puesto en ~/.config no lo encuentra, y como el componente
# es `required` wireplumber NO ARRANCA: el movil se queda sin audio.
#
# Depende de support.modem-manager, que es de donde sale el aviso de llamada
# empezada y terminada — la misma fuente que usa el find-voice-call-profile de
# la propia wireplumber.
wireplumber.components = [
  {
    name = device/mantener-voz-bluetooth.lua, type = script/lua
    provides = hooks.device.profile.mantener-voz-bt
    requires = [ support.modem-manager ]
  }
]

wireplumber.profiles = {
  main = {
    hooks.device.profile.mantener-voz-bt = required
  }
}
