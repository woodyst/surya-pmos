# Audio Bluetooth por el bus del chip (SLIMBus), como hace fabrica.
#
# Sin esto PipeWire abre el socket SCO sin pedir camino de datos, y el enlace se
# monta con `Input/Output Data Path: HCI` — el audio viaja por la CPU. Fabrica
# no manda ni un paquete SCO por HCI (comprobado capturando su trafico).
#
# Requiere ademas:
#   - el driver con `hci_uart hfp_offload=1` (declara el camino no-HCI)
#   - `KernelExperimental` con el UUID de Offload Codecs en bluetoothd
#   - el SLIMBus en pie ANTES que el Bluetooth (scripts/cargar-offload.sh)
#
# ⚠️ SON DOS PROPIEDADES DISTINTAS Y HACEN FALTA LAS DOS:
#
#   bluez5.hw-offload-datapath = 1   -> pone el campo "Data Path" del comando
#       HCI a Vendor Specific (0x01), es decir, le DICE AL CHIP que el audio
#       ira por su bus. Esto ya funcionaba: se ve en btmon.
#
#   bluez5.hw-offload-sco = true     -> hace que WIREPLUMBER cree un nodo de
#       offload (createOffloadScoNode en monitors/bluez.lua) en vez del nodo
#       SCO normal. El de offload es un loopback con el lado de reproduccion
#       en `node.passive`: NO escribe en el socket.
#
# Sin la segunda, el chip espera el audio por el bus y PipeWire se lo manda
# ADEMAS por HCI: medido con btmon el 2026-08-06, ~330 paquetes/s durante toda
# la llamada, sin pausa ni cuando la llamada estaba en el altavoz. Ese bombeo
# inutil es lo que desestabiliza el chip.
monitor.bluez.properties = {
  bluez5.hw-offload-datapath = 1
  bluez5.hw-offload-sco = true
}
