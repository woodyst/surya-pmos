# Suspensión de los nodos de la tarjeta del móvil.
#
# ---------------------------------------------------------------------------
# HISTORIA — leer antes de tocar esto
# ---------------------------------------------------------------------------
# Aquí había `session.suspend-timeout-seconds = 0` y `node.pause-on-idle =
# false`, es decir: NO SUSPENDER NUNCA. Se puso por una razón real: con la
# llamada en el auricular Bluetooth la ruta interna queda ociosa, wireplumber
# la suspendía a los 5 s, y al remontarla el ciclo apagado/encendido de los
# relojes LPASS hacía REVENTAR al servicio AFE del firmware del DSP:
#
#   clk 780/781/782 -> freq=0        (suspensión)
#   ...3 s...
#   q6afe_i2s_port_prepare
#   clk 780..783 -> 19200000         (reencendido)
#   PDM: service 'audio_process' crash: EX:audio_process:0x2:AfeS:0xbf
#
# y detrás se iba el chip del bus, todo daba -110 y el móvil se reiniciaba.
#
# ⚠️ EL ERROR NO FUE PONERLO, FUE SU ALCANCE: protegía las llamadas y se
# aplicaba SIEMPRE. Medido el 2026-08-13, eso costaba:
#
#   pcm0p en RUNNING sin reproducir nada
#     -> data-loop de PipeWire hablando con el lpass (ADSP) por apr_audio_svc
#        ~150 veces por segundo
#     -> ~940 interrupciones/s con la pantalla apagada
#     -> el sistema nunca junta los 9,8 ms que pide `cluster_aoss_sleep`
#     -> ese estado profundo NUNCA se elegía (usage 0 en 2,6 h)
#     -> aosd/cxsd/ddr/adsp a cero: NADA dormía
#     -> ~300 mA en reposo, unas 14 h de batería
#
# ---------------------------------------------------------------------------
# AHORA
# ---------------------------------------------------------------------------
# La protección se acota a las llamadas y vive en dos guiones:
#
#   device/mantener-voz-bluetooth.lua  crea/borra $XDG_RUNTIME_DIR/llamada-en-curso
#   node/suspend-node.lua (copia)      no suspende mientras exista esa bandera
#
# Por eso este fichero YA NO fija el tiempo de suspensión: vale el de la
# distribución (5 s). Se conserva por la historia de arriba, que es lo que hace
# falta para no repetir el error.
#
# ⚠️ El servicio call-audio-idle-suspend-workaround NO sirve para esto: actúa
# sobre module-suspend-on-idle de PulseAudio, que aquí no existe.
