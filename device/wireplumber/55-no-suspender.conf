# No suspender los nodos de la tarjeta del movil por inactividad.
#
# Con la llamada en el auricular Bluetooth, la ruta interna queda ociosa y
# wireplumber la suspende a los 5 s (`session.suspend-timeout-seconds`, valor
# por defecto). Al volver a montarse, el ciclo apagado/encendido de los relojes
# LPASS hace REVENTAR al servicio AFE del firmware del DSP:
#
#   clk 780/781/782 -> freq=0        (suspension)
#   ...3 s...
#   q6afe_i2s_port_prepare
#   clk 780..783 -> 19200000         (reencendido)
#   PDM: service 'audio_process' crash: EX:audio_process:0x2:AfeS:0xbf
#
# y detras se va el chip del bus, todo da -110 y el movil se reinicia.
#
# El propio 51-qcom.conf del sistema trae esta perilla, pero COMENTADA.
#
# ⚠️ El servicio call-audio-idle-suspend-workaround NO sirve para esto: actua
# sobre module-suspend-on-idle de PulseAudio, que aqui no existe.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" }
                { node.name = "~alsa_input.platform-sound.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
