# Sustituye el enganche de suspensión de wireplumber por el nuestro, que NO
# suspende mientras haya una llamada en curso.
#
# ⚠️ POR QUE UN COMPONENTE PROPIO Y NO SECUESTRAR EL FICHERO DE FABRICA
#
# Primero se hizo poniendo una copia modificada en
# ~/.local/share/wireplumber/scripts/node/suspend-node.lua, que efectivamente
# se cargaba en lugar de la de la distribución. Pero la cargaba el COMPONENTE de
# fábrica, y ese no declara `requires = [ support.modem-manager ]`.
#
# Resultado, medido el 2026-08-14 con una llamada real: `Plugin.find` devolvía
# el complemento (mm=true) pero el aviso de llamada NUNCA llegaba, así que
# durante una llamada activa el enganche decidía con `llamada=false` y suspendía
# igual. La protección existía sobre el papel y no hacía nada.
#
# El guion de fábrica `device/find-voice-call-profile.lua` usa exactamente la
# misma API y sí recibe los avisos -- la única diferencia es esa línea de
# `requires`. Por eso aquí se declara el componente entero.
wireplumber.components = [
  {
    name = node/suspend-node-surya.lua, type = script/lua
    provides = hooks.node.suspend.surya
    requires = [ support.modem-manager ]
  }
]

wireplumber.profiles = {
  main = {
    # el de la distribución se apaga: lo reemplaza el nuestro
    hooks.node.suspend = disabled
    hooks.node.suspend.surya = required
  }
}
