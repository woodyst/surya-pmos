# Parche 0130 (kernel r82): al desactivar un flujo SLIMbus, retirar sus canales en el
# gestor del DSP (CHAN_CTRL(REMOVE) + RECONFIG_NOW, como el kernel de fabrica).
#
# ★ ARREGLA LA VUELTA AL CASCO A MITAD DE LLAMADA (2026-09-11). Sin esto, mainline genera
# la retirada pero qcom_slim_ngd_xfer_msg la tira: los canales 157/159 siguen definidos
# en el DSP, el bus nunca se apaga de verdad y, dentro de una llamada, al volver del
# altavoz el enlace DSP<->chip queda mudo en los dos sentidos. Con esto, al volver el
# bus se reenumera y suena (banco 21:42 y casco real 21:48, dos llamadas y cuatro
# vueltas).
#
# El parche lo deja APAGADO por defecto (se hizo asi para compararlo en el mismo
# kernel); este fichero lo enciende. Tambien en caliente, entre llamadas:
#   echo Y | sudo tee /sys/module/slim_qcom_ngd_ctrl/parameters/remove_channels
# Un kernel sin el 0130 ignora la opcion con un aviso en el diario.
options slim_qcom_ngd_ctrl remove_channels=1
