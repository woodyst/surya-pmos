# Parche 0129 (kernel r81): rehacer la sesion de voz ENTERA (MVM+CVS+CVP) al
# mover una llamada a otra salida. APAGADO por defecto.
#
# El 2026-09-10 a las 17:10, con esto encendido, se aplico tambien al PRIMER paso
# de la llamada al casco (el que hace wireplumber al empezar) y coincidio con el
# ADSP estrellado; detras cayeron el modem y el firmware de la Wi-Fi, y el modem
# no se recupero sin reiniciar.
#
# Lo enciende el supervisor de la llamada (supervisor-llamada-bt.py) solo cuando
# la llamada ya ha salido del casco, para que afecte unicamente a la VUELTA.
# Un kernel sin el 0129 ignora la opcion con un aviso en el diario.
options q6voice switch_full_session=0
