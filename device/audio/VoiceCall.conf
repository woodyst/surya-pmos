# Voice call configuration for Xiaomi POCO X3 (surya)
#
# A CS voice call never crosses the CPU: the modem's vocoder and the codec
# talk to each other inside the DSP over a q6voice session, and the CS-Voice
# PCM (hw:...,2) only exists to start and stop that session - q6voiced opens
# it when ModemManager reports a call and closes it when the call ends.
# Writing to it fails with EINVAL by design.
#
# So the only thing this verb has to do is tell the DSP where the session's
# two ends live:
#   downlink  CS-Voice -> TERT_MI2S_RX  -> the two TAS amps
#   uplink    TX_CODEC_DMA_TX_3 -> CS-Voice  (WCD9375 AMIC1 over SoundWire)
#
# Enabling the downlink mixer is what triggers the back-end: the LPASS I2S
# clocks come up as soon as the CS-Voice PCM is opened with it set.
#
# The devices below deliberately declare no PlaybackPCM/CapturePCM. hw:...,2
# is q6voiced's to open, not PipeWire's: naming it here makes PipeWire treat
# it as a sink and retry snd_pcm_start() forever, which is exactly the EINVAL
# a hostless front-end answers with.

SectionVerb {
	EnableSequence [
		# downlink: DSP voice session -> amps' I2S port
		cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 1"

		# uplink: the mic's codec DMA port -> DSP voice session
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"

		# TX macro: decimator 0 takes the SoundWire mic, fed from ADC0
		# (the macro's name for the codec's ADC1 output)
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'ADC0'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		# WCD9375: enable ADC1 and its mixer
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 16"

		# Amp analogue gains, as in HiFi: top (earpiece, tas2564) at the
		# vendor's 16 dBV level, bottom (loudspeaker, tas2562) at its
		# minimum.
		cset "name='Left Amp Gain Volume' 13"
		cset "name='Right Amp Gain Volume' 0"
	]

	DisableSequence [
		# The CS-Voice routes deliberately stay ON across verb changes
		# (see the comment in HiFi.conf): turning them off here reopens
		# the q6voiced-vs-callaudiod race on the next incoming call.
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		TQ "Voice"
	}
}

# Held to the ear: top speaker only, mono, quiet.
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Left ASI1 Sel' 'LeftRightDiv2'"
		cset "name='Left Digital Volume Control' 108"
		cset "name='Right Digital Volume Control' 0"
	]

	Value {
		PlaybackPriority 100
	}
}

# Speakerphone: both amps.
SectionDevice."Speaker" {
	Comment "Speakerphone"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Left ASI1 Sel' 'Left'"
		cset "name='Right ASI1 Sel' 'Right'"
		cset "name='Left Digital Volume Control' 108"
		cset "name='Right Digital Volume Control' 108"
	]

	Value {
		PlaybackPriority 200
	}
}
