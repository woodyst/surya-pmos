# Voice call configuration for Xiaomi POCO X3 (surya)
#
# A CS voice call never crosses the CPU: the modem's vocoder and the codec
# talk to each other inside the DSP over a q6voice session, and the CS-Voice
# PCM (hw:...,3) only exists to start and stop that session - q6voiced opens
# it when ModemManager reports a call and closes it when the call ends.
# Writing to it fails with EINVAL by design, so it is never named here: doing
# so makes PipeWire treat it as a sink and retry snd_pcm_start() forever.
#
# So the only thing this verb has to do is tell the DSP where the session's
# two ends live:
#   downlink  CS-Voice -> TERT_MI2S_RX  -> the two TAS amps
#   uplink    TX_CODEC_DMA_TX_3 -> CS-Voice  (WCD9375 AMIC1 over SoundWire)
#
# Enabling the downlink mixer is what triggers the back-end: the LPASS I2S
# clocks come up as soon as the CS-Voice PCM is opened with it set.
#
# ---------------------------------------------------------------------------
# Why the devices below declare MultiMedia3 (hw:...,2) as their PlaybackPCM
#
# Nothing is ever played through it - the call audio never touches it. It
# exists so the profile produces a real sink, and that buys two things:
#   1. a port to select, which is what actually applies the EnableSequence
#      below (see audio/pipewire/README.md: a device with no PCM is never
#      enabled at all);
#   2. somewhere for the volume slider to land. PlaybackVolume points it at
#      the amplifier's own digital volume, which sits AFTER the DSP mixer and
#      therefore does attenuate the call - a plain software sink volume would
#      not, since the call never passes through PipeWire.
#
# MultiMedia3 is a dedicated front-end added for this (kernel patch 0058). It
# cannot be opened unless it has a route to a back-end, so the verb below
# enables 'TERT_MI2S_RX Audio Mixer MultiMedia3'. Without that cset, opening
# hw:...,2 fails with EINVAL and the whole Voice Call profile is dropped as
# unsupported - exactly the same trap as the Mic/MultiMedia2 probe fix in
# HiFi.conf.
#
# Each mode deliberately drives ONE amplifier, which is what lets each have
# its own volume control (PlaybackVolume takes a single mixer element), and
# matches what Xiaomi's own firmware does for speakerphone.
# ---------------------------------------------------------------------------

SectionVerb {
	EnableSequence [
		# downlink: DSP voice session -> amps' I2S port
		cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 1"

		# uplink: the mic's codec DMA port -> DSP voice session
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"

		# Route for the anchor front-end. Must be here in the VERB, not in a
		# device: ACP applies only the verb's EnableSequence before probing
		# each candidate PCM, and without a valid route the DPCM front-end
		# refuses to open at all.
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia3' 1"

		# Ruta del front-end de CAPTURA señuelo (MultiMedia2, hw:...,1). Misma
		# razón que la de arriba y mismo sitio: ACP sondea abriendo el PCM de
		# cada dispositivo con SOLO la EnableSequence del verbo aplicada, y un
		# front-end DPCM sin ruta a un back-end no abre (EINVAL) -> el perfil
		# entero se descarta como no soportado. HiFi.conf apaga esta ruta en su
		# DisableSequence, así que aquí hay que volver a encenderla.
		# Nadie graba por ella durante la llamada: existe para que el perfil
		# tenga FUENTE, y así el botón de silencio tenga dónde actuar.
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"

		# El micro del códec WCD (ADC1, por SoundWire) YA NO se enciende aquí.
		# Antes estaba en el verbo, común a todos los dispositivos; pero el
		# auricular Bluetooth NO usa ese micro (captura por SLIMBUS_7_TX), y
		# dejarlo medio-configurado (analógico on por el verbo, decimador off
		# por el dispositivo) provocaba un choque de SoundWire (reg 0x300e) que
		# impedía crear el CVP → llamada BT sin audio. Ahora cada dispositivo
		# fija su propio micro: Earpiece/Speaker lo encienden, Bluetooth lo
		# apaga. Al estar SOLO en el dispositivo (no duplicado con el verbo) no
		# se reproduce el colapso de la tarjeta que dio la duplicación.

		# Analogue gains. The top amp (tas2564, earpiece) sits at the vendor's
		# 16 dBV level; the bottom one is raised per-device for speakerphone.
		cset "name='Left Amp Gain Volume' 13"
		cset "name='Right Amp Gain Volume' 0"
	]

	DisableSequence [
		# The CS-Voice routes deliberately stay ON across verb changes
		# (see the comment in HiFi.conf): turning them off here reopens
		# the q6voiced-vs-callaudiod race on the next incoming call.
		# (El micro del WCD lo gestiona cada dispositivo, no el verbo.)
		# The anchor route is ours alone, so it can go.
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia3' 0"
	]

	Value {
		TQ "Voice"
	}
}

# Held to the ear: TOP amp only, mono.
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		# Devolver el ruteo al teléfono, por si venimos del dispositivo
		# Bluetooth, que lo mueve a SLIMBUS_7.
		#
		# ⚠️ Solo controles del DSP y del macro TX del SoC. NO tocar aquí la
		# cadena del códec WCD (ADC1*): esos van por SoundWire, y duplicar lo
		# que el verbo ya hace con ellos provocó colisiones de bus, el códec
		# devolviendo EBUSY y las llamadas normales SIN AUDIO.
		cset "name='SLIMBUS_7_RX Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer SLIMBUS_7_TX' 0"
		cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"

		# El micro del teléfono (WCD, por SoundWire). Antes lo encendía el
		# verbo; ahora cada dispositivo fija el suyo (el Bluetooth lo apaga).
		# Estos controles van SOLO aquí, no en el verbo: sin duplicación no hay
		# choque de SoundWire.
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'ADC0'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 16"

		# The call is mono and arrives on the left slot, so the amp that plays
		# must average both slots rather than pick its "own" channel.
		cset "name='Left ASI1 Sel' 'LeftRightDiv2'"
		cset "name='Left Digital Volume Control' 108"
		# bottom amp silent
		cset "name='Right Digital Volume Control' 0"
	]

	Value {
		# Highest priority in this verb: a call starts held to the ear, and
		# both callaudiod and wireplumber's find-voice-call-profile.lua pick
		# the highest-priority Voice Call profile when the call begins.
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 1
		# The volume slider drives the top amp's digital volume, which is in
		# the call's path. Note ACP only parses PlaybackPriority/PlaybackVolume
		# inside "if (device->playback_channels)", so PlaybackChannels above is
		# what makes both of them take effect at all.
		PlaybackVolume "name='Left Digital Volume Control'"
		# ── SILENCIO DEL MICRÓFONO ──────────────────────────────────────
		# Sin CapturePCM el perfil no tiene fuente (sources: 0) y callaudiod no
		# tenía nada que silenciar: el botón de la app no hacía absolutamente
		# nada. hw:...,1 es un SEÑUELO, igual que hw:...,2 en la reproducción:
		# por él no pasa el audio de la llamada, que nunca cruza la CPU. Solo
		# existe para que el perfil produzca una fuente.
		#
		# El silencio de verdad lo hace CaptureVolume sobre 'ADC1 Volume', la
		# ganancia del ADC del códec, que SÍ está en el camino de la llamada.
		# Su escala declara mute=1 en el mínimo, así que 0 es silencio real y no
		# ganancia mínima: medido, la captura pasa de 0,250 a 0,000000 exacto.
		# PulseAudio lleva el control a 0 al silenciar la fuente y lo restaura al
		# desilenciar.
		#
		# ⚠️ NO sirve un CaptureSwitch aquí. Los booleanos del camino
		#    ('CS-Voice Capture Mixer ...', 'TX_AIF1_CAP Mixer DEC0') existen como
		#    elementos simples, pero alsa-lib los clasifica por el NOMBRE y todos
		#    salen como pswitch (reproducción), no cswitch. PulseAudio los ignora
		#    para la captura y cae en un silencio POR SOFTWARE, que no toca la
		#    llamada. Probado: el control se quedaba en 'on' con la fuente muda.
		#
		# ⚠️ Y NO usar 'ADC1 Switch'. La mezcla simple lo presenta como el
		#    interruptor del elemento 'ADC1' y parece el candidato natural, pero
		#    no es un interruptor de audio: solo pone o quita un canal en el
		#    ch_mask del driver, que se lee UNA vez, en el hw_params. Silenciar
		#    con él no haría nada en la llamada en curso y dejaría MUDA la
		#    siguiente. Ver audio/LLAMADAS-MUDAS-SOUNDWIRE.md.
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		# ⚠️ MISMA prioridad que la de reproducción, a propósito. Sin esto, ACP
		#    la calcula sola y el orden se INVIERTE: Bluetooth pasa a ganar la
		#    elección automática de toda llamada con el casco emparejado, que es
		#    exactamente lo que PlaybackPriority 50 existe para evitar.
		CapturePriority 200
		CaptureVolume "name='ADC1 Volume'"
	}
}

# Speakerphone: BOTTOM amp only - the loud main speaker, as Xiaomi's own
# firmware does. One amp per mode is what gives each its own volume control.
SectionDevice."Speaker" {
	Comment "Speakerphone"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		# Devolver el ruteo al teléfono, por si venimos del dispositivo
		# Bluetooth, que lo mueve a SLIMBUS_7.
		#
		# ⚠️ Solo controles del DSP y del macro TX del SoC. NO tocar aquí la
		# cadena del códec WCD (ADC1*): esos van por SoundWire, y duplicar lo
		# que el verbo ya hace con ellos provocó colisiones de bus, el códec
		# devolviendo EBUSY y las llamadas normales SIN AUDIO.
		cset "name='SLIMBUS_7_RX Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer SLIMBUS_7_TX' 0"
		cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"

		# El micro del teléfono (WCD), igual que en Earpiece. Solo en el
		# dispositivo, no en el verbo.
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'ADC0'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 16"

		# top amp silent
		cset "name='Left Digital Volume Control' 0"
		# same mono averaging as the earpiece, for the same reason
		cset "name='Right ASI1 Sel' 'LeftRightDiv2'"
		cset "name='Right Digital Volume Control' 108"
		# Lift the bottom amp out of the minimum gain the verb leaves it at
		# (that value exists to balance the music stereo image, not for a call).
		cset "name='Right Amp Gain Volume' 24"
	]

	Value {
		# Only reached by an explicit speaker-toggle, never auto-selected.
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 1
		PlaybackVolume "name='Right Digital Volume Control'"
		# ── SILENCIO DEL MICRÓFONO ──────────────────────────────────────
		# Sin CapturePCM el perfil no tiene fuente (sources: 0) y callaudiod no
		# tenía nada que silenciar: el botón de la app no hacía absolutamente
		# nada. hw:...,1 es un SEÑUELO, igual que hw:...,2 en la reproducción:
		# por él no pasa el audio de la llamada, que nunca cruza la CPU. Solo
		# existe para que el perfil produzca una fuente.
		#
		# El silencio de verdad lo hace CaptureVolume sobre 'ADC1 Volume', la
		# ganancia del ADC del códec, que SÍ está en el camino de la llamada.
		# Su escala declara mute=1 en el mínimo, así que 0 es silencio real y no
		# ganancia mínima: medido, la captura pasa de 0,250 a 0,000000 exacto.
		# PulseAudio lleva el control a 0 al silenciar la fuente y lo restaura al
		# desilenciar.
		#
		# ⚠️ NO sirve un CaptureSwitch aquí. Los booleanos del camino
		#    ('CS-Voice Capture Mixer ...', 'TX_AIF1_CAP Mixer DEC0') existen como
		#    elementos simples, pero alsa-lib los clasifica por el NOMBRE y todos
		#    salen como pswitch (reproducción), no cswitch. PulseAudio los ignora
		#    para la captura y cae en un silencio POR SOFTWARE, que no toca la
		#    llamada. Probado: el control se quedaba en 'on' con la fuente muda.
		#
		# ⚠️ Y NO usar 'ADC1 Switch'. La mezcla simple lo presenta como el
		#    interruptor del elemento 'ADC1' y parece el candidato natural, pero
		#    no es un interruptor de audio: solo pone o quita un canal en el
		#    ch_mask del driver, que se lee UNA vez, en el hw_params. Silenciar
		#    con él no haría nada en la llamada en curso y dejaría MUDA la
		#    siguiente. Ver audio/LLAMADAS-MUDAS-SOUNDWIRE.md.
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		# ⚠️ MISMA prioridad que la de reproducción, a propósito. Sin esto, ACP
		#    la calcula sola y el orden se INVIERTE: Bluetooth pasa a ganar la
		#    elección automática de toda llamada con el casco emparejado, que es
		#    exactamente lo que PlaybackPriority 50 existe para evitar.
		CapturePriority 100
		CaptureVolume "name='ADC1 Volume'"
	}
}

# Un auricular Bluetooth. El audio sigue sin pasar por la CPU: el DSP lo saca
# por SLIMBus al WCN3990, cuyos puertos SCO lo llevan al auricular. Es el
# camino del firmware de fábrica ("voicemmode1-call bt-sco").
SectionDevice."Bluetooth" {
	Comment "Bluetooth headset"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		# Bajada: de los amplificadores al chip.
		cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 0"
		cset "name='SLIMBUS_7_RX Voice Mixer CS-Voice' 1"

		# Subida: el micrófono del auricular en vez del del teléfono.
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='CS-Voice Capture Mixer SLIMBUS_7_TX' 1"

		# El micro del móvil se queda ENCENDIDO Y COMPLETO también aquí.
		# La llamada no lo usa (el CVP apunta a SLIMBUS_7_TX), pero apagarlo
		# obligaba a re-levantar la cadena SoundWire del WCD al volver a
		# altavoz/auricular EN MITAD de la llamada, y ese re-enganche fallaba
		# ('soundwire: link failed to connect') dejando el micro muerto para
		# el resto de la llamada. Con la cadena idéntica en los tres
		# dispositivos, el cambio de salida no toca el SoundWire en absoluto.
		# (El apagado anterior venía del choque 0x300e, que era por dejarla a
		# MEDIAS: analógico on + decimador off. Entera-encendida no choca.)
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'ADC0'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 16"

		# Amplificadores callados mientras el audio está en el auricular.
		cset "name='Left Digital Volume Control' 0"
		cset "name='Right Digital Volume Control' 0"
	]

	# Vacío a propósito: devolver rutas aquí deja un instante sin ninguna ruta
	# de captura válida, y si q6voiced abre el PCM de voz en esa ventana falla
	# con -EIO y la llamada se queda muda. Cada dispositivo fija su ruteo al
	# activarse.
	DisableSequence [
	]

	Value {
		# La MENOR de las tres, a propósito. Con prioridad alta este perfil
		# ganaba la elección automática en TODA llamada con el auricular
		# emparejado, así que el audio se iba por un camino que todavía no
		# transporta nada: llamadas mudas sin haber pedido Bluetooth. Mientras
		# el camino no esté probado, aquí solo se llega eligiéndolo a mano:
		#   pactl set-card-profile alsa_card.platform-sound "Voice Call (Bluetooth)"
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 1
		# ⚠️⚠️ AQUÍ NO SE DECLARA FUENTE. NO VOLVER A INTENTARLO SIN MEDIRLO.
		#
		# El 2026-08-22 se probó a darle CapturePCM/CaptureChannels/CapturePriority
		# para que el botón de silencio tuviera dónde actuar. Resultado: la llamada
		# por casco se quedó SIN AUDIO, y además el perfil Bluetooth pasó a ganar la
		# elección automática de toda llamada con el casco emparejado — exactamente
		# lo que PlaybackPriority 50 existe para evitar (ver el comentario de abajo).
		#
		# El camino de la subida por SLIMBUS_7 no tiene ninguna ganancia expuesta en
		# el mezclador, así que aquí no hay silencio posible por UCM. El único
		# candidato es 'CS-Voice Capture Mixer SLIMBUS_7_TX', que PulseAudio no
		# puede accionar: de los 1201 elementos simples de esta tarjeta, CERO
		# exponen `cswitch`.
	}
}
