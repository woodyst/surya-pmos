# Use case configuration for Xiaomi POCO X3 (surya)
# Author: Danila Tikhonov <danila@jiaxyga.com>, stereo/earpiece by pmOS work
#
# Two amps on one shared I2S bus:
#   chip 0x4c  (ALSA prefix "Right")  = BOTTOM speaker, by the USB port
#   chip 0x4d  (ALSA prefix "Left")   = TOP speaker, by the screen; doubles
#                                        as the earpiece for calls
# Each amp is mono and picks which channel of the stereo frame it plays via
# its ASI1 Sel mux. Routing between the two is done by muting the amp that
# should stay quiet (they share the PCM, there is no DSP-side mixer).

SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Amp analogue gains. Top (earpiece, tas2564) at the vendor's
		# 16 dBV level (control value 13); higher distorts the small
		# transducer. Bottom (main loudspeaker, tas2562) is far more
		# sensitive, so it is dropped to its minimum (8.5 dB) to balance
		# the stereo image with the much quieter top - tuned by ear.
		cset "name='Left Amp Gain Volume' 13"
		cset "name='Right Amp Gain Volume' 0"
		# Mic capture route, established here (not just in SectionDevice
		# "Mic"'s own EnableSequence) because our DPCM machine driver
		# requires the DAPM path to already exist at PCM *open* time, but
		# ACP's profile-probing (spa-alsa's ucm_probe_profile_set) opens
		# every device's PCM to test it WITHOUT ever running that
		# device's own EnableSequence first - only the verb's. Without
		# this, MultiMedia2 (the Mic capture front-end) fails to open
		# with EINVAL during probing ("no valid Capture path" in dmesg
		# with dynamic debug on soc-pcm.c) and every HiFi profile variant
		# that includes Mic gets silently dropped as "not supported".
		# Harmless to enable unconditionally: these are just DAPM route/
		# mux selections, not the analogue supply itself - MIC BIAS1/
		# AMIC1/ADC1 only actually power up once a capture stream is
		# really running through this path.
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'ADC0'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 16"
		# CS-Voice routing, kept permanently enabled (here AND in the
		# Voice Call verb, removed from both DisableSequences): q6voiced
		# opens the CS-Voice PCM the instant a call goes active, racing
		# callaudiod's HiFi -> Voice Call UCM switch. If these routes are
		# off at that moment the capture open fails with EINVAL ("Failed
		# to open tx") and the whole call runs without uplink -
		# deterministically on INCOMING calls, where answering triggers
		# the open while the ringtone still holds the HiFi verb. A route
		# into an idle DPCM front-end carries nothing outside a voice
		# session, so always-on is safe.
		cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		# ⚠️ NO apagar aquí la cadena SoundWire del micro del WCD.
		#
		# 'ADC1 Switch' no es un interruptor de hardware: lo único que hace es
		# poner o quitar el canal en port_config[].ch_mask del driver, y ese
		# ch_mask solo se lee UNA VEZ, en el hw_params del PCM. Si vale 0 en
		# ese instante, el flujo SoundWire se registra con CERO puertos
		# (sdw_stream_add_slave con num_ports=0, que devuelve 0 tan feliz), el
		# puerto de datos del micro nunca se abre y la SUBIDA de la llamada
		# queda muda hasta que se cuelga. Sin un solo error en ningún sitio.
		#
		# Y aquí se apagaba justo en la peor ventana: al pasar de HiFi a Voice
		# Call, wireplumber escribe estos 0 y ~220 ms después el 1 del verbo de
		# llamada; q6voiced abre el PCM de voz en cuanto ModemManager da la
		# llamada por activa, y si cae en medio -> llamada muda. Medido el
		# 2026-08-22: 8 de 8 llamadas, np=0 <=> puerto cerrado <=> muda.
		#
		# Dejarlos encendidos no cuesta nada: son selecciones de ruta/mux, no
		# la alimentación analógica (ver el comentario de la EnableSequence).
		# Es lo mismo que ya se hizo con las rutas CS-Voice, y lo que
		# VoiceCall.conf hace en sus tres dispositivos.
	]

	Value {
		TQ "HiFi"
	}
}

# Loudspeaker: real stereo across BOTH amps. Covers music, video,
# speakerphone and the ringtone - everything that should come out loud
# on both speakers.
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		# top plays the left channel, bottom plays the right channel
		cset "name='Left ASI1 Sel' 'Left'"
		cset "name='Right ASI1 Sel' 'Right'"
		# both up; top slightly attenuated later if it needs balancing
		cset "name='Left Digital Volume Control' 108"
		cset "name='Right Digital Volume Control' 108"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# Earpiece: top speaker only, mono, quiet - for a call held to the ear.
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Left ASI1 Sel' 'LeftRightDiv2'"
		cset "name='Left Digital Volume Control' 108"
		cset "name='Right Digital Volume Control' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}

# Microphone: bottom analogue mic (AMIC1) -> WCD9375 ADC1 -> SoundWire TX
# -> TX macro DEC0 -> TX_CODEC_DMA_TX_3 -> MultiMedia2.
#
# Capture deliberately uses MultiMedia2 (hw:...,1), NOT MultiMedia1: the
# playback devices above already hold MultiMedia1 open, and these are DPCM
# front-ends with one q6asm client each, so capturing on the same FE fails
# with "Audio Client already active".
SectionDevice."Mic" {
	Comment "Built-in Microphone"

	EnableSequence [
		# route the front-end to the TX codec DMA back-end
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		# TX macro: decimator 0 takes the SoundWire mic, fed from ADC0
		# (which is the macro's name for the codec's ADC1 output)
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'ADC0'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		# WCD9375: enable ADC1 and its mixer
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 16"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		# Igual que en el verbo: NO tocar 'ADC1 Switch' al apagar. Ver la
		# explicación larga en la DisableSequence del verbo HiFi.
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "ADC1 Volume"
	}
}
